<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Photo placeholder — modular building line drawing">
  <rect width="800" height="600" fill="#22262B"/>
  <!-- ground line -->
  <line x1="0" y1="430" x2="800" y2="430" stroke="#3B424A" stroke-width="2"/>
  <!-- modular unit, technical line drawing -->
  <g stroke="#5A6570" stroke-width="2" fill="none">
    <rect x="140" y="250" width="360" height="180"/>
    <rect x="500" y="250" width="200" height="180"/>
    <!-- panel seams -->
    <line x1="230" y1="250" x2="230" y2="430"/>
    <line x1="320" y1="250" x2="320" y2="430"/>
    <line x1="410" y1="250" x2="410" y2="430"/>
    <line x1="590" y1="250" x2="590" y2="430"/>
    <!-- roof line -->
    <line x1="140" y1="250" x2="700" y2="250"/>
    <line x1="140" y1="238" x2="700" y2="238"/>
    <!-- window -->
    <rect x="520" y="290" width="70" height="55"/>
    <line x1="555" y1="290" x2="555" y2="345"/>
    <!-- door -->
    <rect x="250" y="330" width="55" height="100"/>
  </g>
  <!-- dimension marks -->
  <g stroke="#C8102E" stroke-width="2">
    <line x1="500" y1="455" x2="700" y2="455"/>
    <line x1="500" y1="448" x2="500" y2="462"/>
    <line x1="700" y1="448" x2="700" y2="462"/>
  </g>
  <text x="600" y="480" fill="#AAB2BB" font-family="Archivo, Arial, sans-serif" font-size="20" text-anchor="middle">3 m</text>
  <text x="400" y="545" fill="#6B7580" font-family="Archivo, Arial, sans-serif" font-size="22" text-anchor="middle" letter-spacing="3">EBM — INSTALLATION PHOTO</text>
</svg>
