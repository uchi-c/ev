<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Stage 4 — finished building">
  <rect width="800" height="600" fill="#22262B"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#3B424A" stroke-width="2"/>
  <!-- foundation -->
  <g stroke="#5A6570" stroke-width="2" fill="none"><rect x="150" y="450" width="500" height="20"/></g>
  <!-- two-storey stacked building -->
  <g stroke="#AAB2BB" stroke-width="2" fill="none">
    <!-- ground floor -->
    <rect x="200" y="290" width="400" height="160"/>
    <line x1="300" y1="290" x2="300" y2="450"/>
    <line x1="400" y1="290" x2="400" y2="450"/>
    <line x1="500" y1="290" x2="500" y2="450"/>
    <rect x="230" y="330" width="45" height="80"/>
    <rect x="330" y="330" width="55" height="45"/>
    <rect x="430" y="330" width="55" height="45"/>
    <rect x="530" y="330" width="45" height="80"/>
    <!-- upper floor -->
    <rect x="220" y="150" width="360" height="140"/>
    <line x1="220" y1="140" x2="580" y2="140"/>
    <line x1="310" y1="150" x2="310" y2="290"/>
    <line x1="400" y1="150" x2="400" y2="290"/>
    <line x1="490" y1="150" x2="490" y2="290"/>
    <rect x="250" y="190" width="50" height="45"/>
    <rect x="340" y="190" width="50" height="45"/>
    <rect x="430" y="190" width="50" height="45"/>
    <rect x="520" y="190" width="40" height="45"/>
  </g>
  <!-- red roof accent -->
  <rect x="220" y="132" width="360" height="8" fill="#C8102E"/>
  <text x="400" y="120" fill="#6B7580" font-family="Archivo, Arial, sans-serif" font-size="26" text-anchor="middle" letter-spacing="4">04 · FINISHED — STACKED TO 2 STOREYS</text>
  <text x="400" y="545" fill="#3B424A" font-family="Archivo, Arial, sans-serif" font-size="18" text-anchor="middle" letter-spacing="3">EBM — add: site-photo-04-two-storey-building</text>
</svg>
